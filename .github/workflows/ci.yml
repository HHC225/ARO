name: ARO validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: skills/aro/scripts
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and adapter tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Native command-line and launcher smoke
        run: python tests/smoke_cli.py
      - name: Compile bundled Python
        run: python -m compileall -q skills/aro/scripts
